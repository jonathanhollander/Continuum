# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Gitleaks - Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        description: Scans for hardcoded secrets using gitleaks
        entry: gitleaks protect --staged --verbose --redact
        language: golang
        pass_filenames: false

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        args: ['--maxkb=1024']
        name: Check for large files (>1MB)
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: end-of-file-fixer
        name: Fix end of file
      - id: trailing-whitespace
        name: Trim trailing whitespace
        args: [--markdown-linebreak-ext=md]

  # Python-specific hooks
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Format Python code (Black)
        language_version: python3
        files: ^backend/.*\.py$

  # Security scanning for Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: Python security scan (Bandit)
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ["bandit[toml]"]
        files: ^backend/.*\.py$
        exclude: ^backend/alembic/

# Configuration for gitleaks
# Create .gitleaks.toml for custom rules if needed
